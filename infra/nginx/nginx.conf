# Balanceador do Fast Attendance.
# Os nomes dos serviços são resolvidos dinamicamente pelo DNS do Docker (127.0.0.11), então
# réplicas criadas ou derrubadas com `docker compose up --scale` entram e saem do balanceamento
# sem reiniciar o Nginx.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format principal '$remote_addr "$request" $status $body_bytes_sent '
                         'upstream=$upstream_addr tempo=$request_time';
    access_log /dev/stdout principal;
    error_log /dev/stderr warn;

    # Necessário para o upgrade HTTP → WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api {
        zone upstream_api 64k;
        server api:8080 resolve max_fails=2 fail_timeout=5s;
    }

    # Ponte WebSocket (sobe o navegador ao servidor de sessão por TCP; ver ponte/)
    upstream ponte {
        zone upstream_ponte 64k;
        server ponte:8082 resolve max_fails=2 fail_timeout=5s;
    }

    upstream professor {
        zone upstream_professor 64k;
        server professor:3000 resolve;
    }

    upstream aluno {
        zone upstream_aluno 64k;
        server aluno:3001 resolve;
    }

    server {
        listen 80;
        server_name _;
        # Redirecionamentos relativos: preservam a porta publicada no host
        absolute_redirect off;

        client_max_body_size 5m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # API REST (Spring Boot)
        location /api/ {
            proxy_pass http://api;
            proxy_next_upstream error timeout http_502 http_503;
        }

        # Ponte WebSocket para o servidor de sessão
        location = /ws {
            proxy_pass http://ponte;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Maior que o timeout de inatividade do protocolo (60 s)
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }

        # Aplicações Next.js (basePath /professor e /aluno)
        location /professor {
            proxy_pass http://professor;
        }

        location /aluno {
            proxy_pass http://aluno;
        }

        location = / {
            return 302 /aluno;
        }
    }
}
