spring:
  application:
    name: fast-attendance-api
  autoconfigure:
    # A autenticação é feita só por JWT; dispensa o usuário em memória padrão do Spring Security
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/fast_attendance?directConnection=true}

fastattendance:
  jwt:
    segredo: ${JWT_SECRET}
    validade-horas: ${JWT_EXPIRACAO_HORAS:12}

server:
  port: ${API_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
